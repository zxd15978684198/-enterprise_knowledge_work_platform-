[project]
name = "pyknora"
version = "0.1.0"
description = "PyKnora 企业知识工作平台（P0 MVP）：可引用问答、混合检索、知识库管理"
readme = "README.md"
authors = [
    { name = "ZhangXianDa", email = "zxd15978684198@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "asyncpg>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
pyknora = "pyknora:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Phase 0 实验套件有自己的依赖与 venv（-c experiments/phase0/pyproject.toml），
# 根项目测试不递归进去，避免缺 langchain/redis 导致收集失败。
addopts = "-q --ignore=tests/phase0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
# Phase 0 实验代码与参考源码各有自己的规范/依赖，根项目不扫描。
extend-exclude = ["tests/phase0", "experiments", "references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# 中文注释与文档串里的全角标点是有意为之，不视为歧义字符。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
