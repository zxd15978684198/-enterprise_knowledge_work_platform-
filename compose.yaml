# PyKnora Phase 1（P0 MVP）部署形态：api + worker + postgres(pgvector) + redis + minio。
#
# 本地开发默认走 `PYKNORA_INGEST_MODE=inline` + 本地目录存储（uv run python -m pyknora.serve），
# 这里演示的是「一个命令起一整套」，用于验收 Compose 与异步/对象存储链路。
#
# 端口刻意错开实验栈（experiments/phase0/compose.yaml 用 5433/6380），避免同名冲突。
name: pyknora

x-app-env: &app-env
  PYKNORA_ENV: prod
  PYKNORA_LOG_LEVEL: ${PYKNORA_LOG_LEVEL:-INFO}
  PYKNORA_DATABASE_URL: postgresql+asyncpg://pyknora:${PYKNORA_DB_PASSWORD:-phase0-local-only}@db:5432/pyknora
  PYKNORA_JWT_SECRET: ${PYKNORA_JWT_SECRET:-dev-insecure-change-me}
  PYKNORA_REDIS_URL: redis://redis:6379/0
  PYKNORA_STORAGE_BACKEND: s3
  PYKNORA_S3_ENDPOINT_URL: http://minio:9000
  PYKNORA_S3_ACCESS_KEY: ${PYKNORA_S3_ACCESS_KEY:-pyknora}
  PYKNORA_S3_SECRET_KEY: ${PYKNORA_S3_SECRET_KEY:-pyknora-dev-secret}
  PYKNORA_S3_BUCKET: ${PYKNORA_S3_BUCKET:-pyknora}
  PYKNORA_INGEST_MODE: queue
  PYKNORA_WEB_DIR: /app/src/pyknora/web
  PYKNORA_UPLOAD_DIR: /data/uploads

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pyknora
      POSTGRES_PASSWORD: ${PYKNORA_DB_PASSWORD:-phase0-local-only}
      POSTGRES_DB: pyknora
    ports:
      - "5544:5432"
    volumes:
      - pyknora-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyknora -d pyknora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - pyknora-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 未固定 digest：拉取时以实际镜像为准，生产部署前应改为 `@sha256:` 形式（见 ADR-0012）。
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${PYKNORA_S3_ACCESS_KEY:-pyknora}
      MINIO_ROOT_PASSWORD: ${PYKNORA_S3_SECRET_KEY:-pyknora-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pyknora-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - python -m pyknora.migrate && python -m uvicorn pyknora.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "celery", "-A", "pyknora.queue", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pyknora-db:
  pyknora-redis:
  pyknora-minio:
